# Deployed as-is. Every environment-specific value is a variable with a default,
# so there is never a reason to hand-edit a copy on a server — set it in that
# host's .env instead. For local development, layer docker-compose.dev.yml on top
# to build from source:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
services:
  # bgutil service provides PO (Proof of Origin) tokens for SABR streaming workaround
  # Required for downloading DASH formats from certain YouTube videos
  bgutil:
    # Track the latest release: bgutil chases YouTube's anti-bot changes, so a
    # stale token server stops returning DASH formats. The pip plugin in
    # requirements.txt floats on >= for the same reason, keeping the pair aligned.
    # The node variant is explicit because the healthcheck below shells out to node.
    image: brainicism/bgutil-ytdlp-pot-provider:node
    container_name: bgutil-pot-provider
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4416/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  youtube-downloader:
    # Defaults to the published image. docker-compose.dev.yml overrides this to
    # build from source locally.
    image: ${COMPOSE_IMAGE:-ghcr.io/brianfromm/youtube-downloader:latest}
    container_name: youtube-downloader
    restart: unless-stopped
    # Give an in-flight download time to finish rather than dying mid-merge
    stop_grace_period: 30s
    depends_on:
      bgutil:
        condition: service_healthy
    ports:
      # BIND_ADDRESS restricts the listener to a single host interface.
      # The default binds all interfaces.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - /tmp:/tmp
      # The server writes to /app/processed_files inside the container; this
      # exposes them on the host for access and debugging.
      - ${PROCESSED_DIR:-./processed_videos_host}:/app/processed_files
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - USE_DEV_SERVER=${USE_DEV_SERVER:-false}
      - APP_PORT=${APP_PORT:-8080}
      - BGUTIL_BASE_URL=http://bgutil:4416
      # Must stay 1 — the task queue is in-memory and not shared between workers
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      # 0 means no timeout, so a long download is never killed mid-transfer
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-0}
      - GUNICORN_LOGLEVEL=${GUNICORN_LOGLEVEL:-info}
      # Behind a reverse proxy, set this to the proxy's IP/CIDR — otherwise every
      # request is logged with the proxy's address instead of the real client's
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
